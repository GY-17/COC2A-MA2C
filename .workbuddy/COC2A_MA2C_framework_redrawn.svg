<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4e5d6b"/></marker><marker id="r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9e3b42"/></marker></defs>
<rect width="1500" height="920" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#16324f} .title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#59636e}.h{font-size:18px;font-weight:700}.t{font-size:15px}.s{font-size:13px;fill:#59636e}.box{stroke:#16324f;stroke-width:2}.dash{stroke-dasharray:8 6}.red{fill:#9e3b42}.white{fill:white}.arrow{stroke:#4e5d6b;stroke-width:2;fill:none;marker-end:url(#a)}.redarrow{stroke:#9e3b42;stroke-width:2;fill:none;marker-end:url(#r)}</style>
<text x="750" y="35" text-anchor="middle" class="title">COC2A–MA2C Framework for Flexible Truck–UAV Emergency Rescue</text>
<text x="750" y="60" text-anchor="middle" class="sub">Centralized training with decentralized execution (CTDE)</text>

<!-- environment -->
<rect x="28" y="82" width="1444" height="115" rx="15" fill="#f5f7fa" stroke="#59636e" stroke-width="2"/>
<text x="750" y="108" text-anchor="middle" class="h">Dynamic truck–UAV rescue environment</text>
<path d="M100 155 L270 140 L440 160 L610 132 L780 158 L950 135 L1120 160 L1290 140 L1400 158" fill="none" stroke="#8da4b8" stroke-width="3"/>
<g fill="#f7c58a" stroke="#16324f" stroke-width="2"> <circle cx="100" cy="155" r="15"/><circle cx="270" cy="140" r="15"/><circle cx="440" cy="160" r="15"/><circle cx="610" cy="132" r="15"/><circle cx="780" cy="158" r="15"/><circle cx="950" cy="135" r="15"/><circle cx="1120" cy="160" r="15"/><circle cx="1290" cy="140" r="15"/><circle cx="1400" cy="158" r="15"/></g>
<text x="100" y="160" text-anchor="middle" class="s">R</text><text x="270" y="145" text-anchor="middle" class="s">R</text><text x="440" y="165" text-anchor="middle" class="s">R</text><text x="610" y="137" text-anchor="middle" class="s">R</text><text x="780" y="163" text-anchor="middle" class="s">R</text><text x="950" y="140" text-anchor="middle" class="s">R</text><text x="1120" y="165" text-anchor="middle" class="s">R</text><text x="1290" y="145" text-anchor="middle" class="s">R</text><text x="1400" y="163" text-anchor="middle" class="s">R</text>
<text x="55" y="188" class="s">Depot</text><text x="140" y="188" class="s">Truck</text><text x="220" y="188" class="s">UAV</text><text x="1418" y="188" text-anchor="end" class="s">dynamic requests • damaged roads • deadlines</text>

<!-- actors -->
<rect x="28" y="225" width="875" height="290" rx="17" fill="#f8fbfd" class="box"/>
<text x="465" y="255" text-anchor="middle" class="h">Decentralized actors (MA2C)</text>
<rect x="52" y="275" width="825" height="90" rx="12" fill="#cfe5f5" class="box"/>
<text x="70" y="302" class="t" font-weight="700">Truck actor</text><text x="70" y="341" class="s">local observation oᵢ,ₜ</text>
<g fill="#f7c58a" class="box"><rect x="205" y="308" width="70" height="34"/><rect x="290" y="308" width="70" height="34"/><rect x="375" y="308" width="70" height="34"/></g><text x="240" y="330" text-anchor="middle" class="s">FC</text><text x="325" y="330" text-anchor="middle" class="s">FC</text><text x="410" y="330" text-anchor="middle" class="s">LSTM</text>
<rect x="470" y="308" width="120" height="34" rx="4" fill="white" class="box"/><text x="530" y="330" text-anchor="middle" class="s">Routing head</text><rect x="615" y="308" width="105" height="34" rx="4" fill="white" class="box"/><text x="667" y="330" text-anchor="middle" class="s">Mode head</text><rect x="745" y="308" width="95" height="34" rx="4" fill="#bfe7e1" class="box"/><text x="792" y="330" text-anchor="middle" class="s">Mask</text>
<rect x="52" y="390" width="825" height="90" rx="12" fill="#dcccf0" class="box"/>
<text x="70" y="417" class="t" font-weight="700">UAV actor</text><text x="70" y="456" class="s">local observation oᵢ,ₜ</text>
<g fill="#f7c58a" class="box"><rect x="205" y="423" width="70" height="34"/><rect x="290" y="423" width="70" height="34"/><rect x="375" y="423" width="70" height="34"/></g><text x="240" y="445" text-anchor="middle" class="s">FC</text><text x="325" y="445" text-anchor="middle" class="s">FC</text><text x="410" y="445" text-anchor="middle" class="s">LSTM</text>
<rect x="470" y="423" width="105" height="34" rx="4" fill="white" class="box"/><text x="522" y="445" text-anchor="middle" class="s">Service head</text><rect x="590" y="423" width="115" height="34" rx="4" fill="white" class="box"/><text x="647" y="445" text-anchor="middle" class="s">Rendezvous</text><rect x="720" y="423" width="55" height="34" rx="4" fill="white" class="box"/><text x="747" y="445" text-anchor="middle" class="s">Mode</text><rect x="790" y="423" width="50" height="34" rx="4" fill="#bfe7e1" class="box"/><text x="815" y="445" text-anchor="middle" class="s">Mask</text>
<path d="M900 320 H950" class="arrow"/><path d="M900 435 H950" class="arrow"/><text x="918" y="311" class="s">a_TR,t</text><text x="918" y="426" class="s">a_DR,t</text>

<!-- buffer -->
<rect x="955" y="260" width="190" height="245" rx="15" fill="#d7ecd7" class="box"/><text x="1050" y="290" text-anchor="middle" class="t" font-weight="700">On-policy rollout buffer</text><text x="1050" y="316" text-anchor="middle" class="h red">B</text>
<g fill="white" stroke="#7e9a86"><rect x="980" y="333" width="140" height="23"/><rect x="980" y="362" width="140" height="23"/><rect x="980" y="391" width="140" height="23"/><rect x="980" y="420" width="140" height="23"/><rect x="980" y="449" width="140" height="23"/></g><text x="1050" y="350" text-anchor="middle" class="s">S_t, o_i,t</text><text x="1050" y="379" text-anchor="middle" class="s">a_t, r_t</text><text x="1050" y="408" text-anchor="middle" class="s">m_t, pi_t</text><text x="1050" y="437" text-anchor="middle" class="s">rollout tuples</text><text x="1050" y="466" text-anchor="middle" class="s">on-policy</text>

<!-- critic panel -->
<rect x="28" y="540" width="1444" height="345" rx="17" fill="#fbfcfe" class="box"/>
<text x="750" y="570" text-anchor="middle" class="h">Centralized critic and COC2A credit assignment</text>
<rect x="52" y="607" width="300" height="190" rx="13" fill="#cfe5f5" class="box"/><text x="202" y="637" text-anchor="middle" class="t" font-weight="700">Global state encoding</text><text x="202" y="662" text-anchor="middle" class="s">S_t: (B,N,Gdim)</text>
<rect x="76" y="690" width="70" height="38" fill="white" class="box"/><text x="111" y="714" text-anchor="middle" class="s">Embed</text><rect x="164" y="690" width="95" height="38" fill="#bfe7e1" class="box"/><text x="211" y="706" text-anchor="middle" class="s">Transformer</text><text x="211" y="720" text-anchor="middle" class="s">MHSA</text><rect x="277" y="690" width="50" height="38" fill="#fff1b6" class="box"/><text x="302" y="714" text-anchor="middle" class="s">Pool</text><path d="M146 709 H164 M259 709 H277" class="arrow"/><text x="202" y="762" text-anchor="middle" class="t red" font-weight="700">zₛ</text>
<path d="M353 702 H385" class="redarrow"/>

<!-- COC2A -->
<rect x="390" y="592" width="1050" height="270" rx="15" fill="#f5d1d7" stroke="#9e3b42" stroke-width="2.5"/><text x="620" y="622" text-anchor="middle" class="h red">COC2A mechanism</text>
<text x="410" y="650" class="t" font-weight="700">Action counterfactuals</text>
<rect x="410" y="665" width="130" height="53" rx="6" fill="#f7c58a" class="box"/><text x="475" y="688" text-anchor="middle" class="t" font-weight="700">a_t</text><text x="475" y="707" text-anchor="middle" class="s">executed one-hot</text><rect x="560" y="665" width="130" height="53" rx="6" fill="#bfe7e1" class="box"/><text x="625" y="688" text-anchor="middle" class="t" font-weight="700">pi_t</text><text x="625" y="707" text-anchor="middle" class="s">joint policy</text><rect x="710" y="665" width="165" height="53" rx="6" fill="#fff1b6" class="box"/><text x="792" y="688" text-anchor="middle" class="t" font-weight="700">c_i,t=(a_-i,pi_i)</text><text x="792" y="707" text-anchor="middle" class="s">individual counterfactual</text>
<path d="M540 692 H905 M690 692 H905 M875 692 H905" class="arrow"/>
<rect x="905" y="651" width="205" height="84" rx="8" fill="white" class="box"/><text x="1008" y="677" text-anchor="middle" class="t" font-weight="700">Shared Q critic</text><text x="1008" y="700" text-anchor="middle" class="s">Q_phi(z_s,x)=V(z_s)+w(z_s)^T x</text><text x="1008" y="720" text-anchor="middle" class="s">value + action-weight heads</text>
<path d="M1110 667 H1140 M1110 693 H1140 M1110 719 H1140" class="arrow"/><text x="1150" y="672" class="s">Qφ(zₛ,aₜ)</text><text x="1150" y="698" class="s">bJnt(zₛ,πₜ)</text><text x="1150" y="724" class="s">bInd(zₛ,cᵢ,ₜ)</text>

<!-- coordination branch -->
<rect x="410" y="758" width="480" height="77" rx="8" fill="#e6b74a" class="box"/><text x="650" y="781" text-anchor="middle" class="t" font-weight="700">Coordination-state weight generator</text><text x="650" y="804" text-anchor="middle" class="s">[z_s,e_i,t^TR/DR] -&gt; MLP g_omega -&gt; Softmax</text><text x="650" y="823" text-anchor="middle" class="t red">[psi_ind, psi_joint]</text><path d="M510 758 V740 H460 V735" class="redarrow"/>
<path d="M890 796 H995 V735" class="redarrow dash"/><text x="910" y="823" class="s red">CMA-ES: reward-gain fitness</text>
<rect x="1160" y="758" width="235" height="77" rx="8" fill="#ffe4a8" stroke="#9e3b42" stroke-width="2"/><text x="1277" y="782" text-anchor="middle" class="t" font-weight="700">Weighted baseline</text><text x="1277" y="804" text-anchor="middle" class="s">ψind bInd + ψjoint bJnt</text><text x="1277" y="824" text-anchor="middle" class="t red">→ Aᵢ,ₜ</text><path d="M1150 700 V758 H1160" class="redarrow"/><path d="M890 804 H1160" class="redarrow"/>
<rect x="1190" y="840" width="210" height="27" rx="7" fill="#cfe5f5" class="box"/><text x="1295" y="859" text-anchor="middle" class="s" font-weight="700">Actor update + entropy</text><path d="M1277 835 V840" class="arrow"/>
<rect x="930" y="840" width="210" height="27" rx="7" fill="#bfe7e1" class="box"/><text x="1035" y="859" text-anchor="middle" class="s" font-weight="700">Critic update (n-step Rₜ)</text><path d="M1008 735 V840" class="arrow dash"/>

<!-- buffer links -->
<path d="M1050 505 V540 H300 V607" class="arrow dash"/><text x="650" y="530" text-anchor="middle" class="s">Sₜ, aₜ, πₜ from rollout buffer B</text>
<path d="M465 515 V540" class="arrow"/><path d="M465 197 V225" class="arrow"/><path d="M780 197 V225" class="arrow"/>
<text x="475" y="215" class="s">local observations</text><text x="790" y="215" class="s">global state</text>
<text x="35" y="910" class="s">Solid arrows: forward data flow    Dashed arrows: training/optimization dependency</text><text x="1465" y="910" text-anchor="end" class="s red">COC2A = Coordination-aware Counterfactual Credit Assignment</text>
</svg>
